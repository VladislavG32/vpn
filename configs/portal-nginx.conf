worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=portal:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    server {
        listen 2087 ssl;
        ssl_certificate /tls/fullchain.pem;
        ssl_certificate_key /tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        root /srv;
        index index.html;
        autoindex off;
        client_max_body_size 1k;
        client_header_timeout 10s;
        send_timeout 20s;
        keepalive_timeout 15s;
        limit_req zone=portal burst=40 nodelay;
        limit_conn connections 20;
        # All private URLs and HTTP errors are excluded from logs.
        error_log /dev/null crit;
        add_header Cache-Control "no-store, private" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        location = /healthz { access_log off; return 200 'ok'; }
        location /p/ {
            limit_except GET { deny all; }
            try_files $uri $uri/ =404;
        }
        location / { return 404; }
    }
}
