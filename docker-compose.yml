name: private-vpn
x-common: &common
  image: private-vpn:2026-11-12
  build:
    context: .
    dockerfile: configs/Dockerfile
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 128
  mem_limit: 512m
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m", "/run:rw,noexec,nosuid,size=8m"]
  dns: [172.30.77.53]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  dnscrypt:
    <<: *common
    command: ["dnscrypt-proxy", "-config", "/etc/dnscrypt/config.toml"]
    volumes:
      - type: bind
        source: ./data/${VPN_GENERATION:-current}/dnscrypt-proxy.toml
        target: /etc/dnscrypt/config.toml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/${VPN_GENERATION:-current}/blocked-domains.txt
        target: /etc/dnscrypt/blocked-domains.txt
        read_only: true
        bind: {create_host_path: false}
    cap_add: [NET_BIND_SERVICE]
    networks:
      backend: {ipv4_address: 172.30.77.53}
      egress: {gw_priority: 1}
    healthcheck:
      test: ["CMD-SHELL", "dig +time=2 +tries=1 @127.0.0.1 example.com A | grep -q 'status: NOERROR'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
  xray:
    <<: *common
    volumes:
      - type: bind
        source: ./data/${VPN_GENERATION:-current}/xray.json
        target: /etc/xray/config.json
        read_only: true
        bind: {create_host_path: false}
    cap_add: [NET_BIND_SERVICE]
    ports: ["0.0.0.0:443:443/tcp", "0.0.0.0:8443:8443/tcp"]
    networks:
      backend: {}
      egress: {gw_priority: 1}
    depends_on:
      dnscrypt: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 && nc -z 127.0.0.1 8443"]
      interval: 30s
      timeout: 5s
      retries: 3
  awg:
    <<: *common
    volumes:
      - type: bind
        source: ./data/${VPN_GENERATION:-current}/awg.conf
        target: /etc/awg/server.conf
        read_only: true
        bind: {create_host_path: false}
    command: ["/usr/local/bin/awg-entrypoint"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
    ports: ["0.0.0.0:${AWG_PORT:?Run setup.sh first}:51820/udp"]
    networks:
      backend: {}
      egress: {gw_priority: 1}
    depends_on:
      dnscrypt: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "awg show awg0 >/dev/null && ip link show awg0 | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
  portal:
    image: nginx:1.28-alpine
    profiles: [portal]
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101"]
    ports: ["0.0.0.0:2087:2087/tcp"]
    volumes:
      - type: bind
        source: ./data/${VPN_GENERATION:-current}/webroot
        target: /srv
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/portal/tls
        target: /tls
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./configs/portal-nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {create_host_path: false}
    networks: [egress]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:2087/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  backend:
    internal: true
    ipam:
      config: [{subnet: 172.30.77.0/24}]
  egress:
    driver: bridge
