name: VPN checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  config-and-tunnel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-cryptography qrencode
      - name: Unit tests and shell syntax
        run: |
          python3 -m unittest discover -s tests -v
          for script in *.sh configs/*.sh tests/*.sh; do bash -n "$script"; done
      - name: Build pinned sources and exercise AWG 3
        run: bash tests/smoke_awg.sh
